<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="./graphSVG.js"></script>
    <link rel="stylesheet" href="graph.css">
    <title>Document</title>
</head>
<body>
    <div id="app">
        <aside id="toolbar">
            <h2>Tools</h2>
            <button class="mode-button" data-mode="addNode">Add node</button>
            <button class="mode-button" data-mode="addEdge">Add edge</button>
            <button class="mode-button" data-mode="delete">Delete</button>
            <button class="mode-button" data-mode="setStart">Set start</button>

            <div id="mode-indicator">Mode: None</div>

            <h2>Algorithm</h2>
            <select id="algorithm-select">
                <option value="BFS">BFS</option>
                <option value="DFS">DFS</option>
            </select>
            <button id="run-button">Run</button>

            <h2>Playback</h2>
            <div id="playback-controls">
                <button id="skip-start">⏮</button>
                <button id="step-back">◀</button>
                <button id="play-pause">▶</button>
                <button id="step-forward">▶</button>
                <button id="skip-end">⏭</button>
            </div>
            <div id="step-indicator">Step 0 / 0</div>
            <h2 id="queue-label">Queue</h2>
            <div id="queue-display">—</div>
        </aside>

        <svg id="graph-canvas" width="800" height="600">
            <g id="edge-layer"></g>
            <g id="node-layer"></g>
            <g id="label-layer"></g>
        </svg>
    </div>
</body>
</html>
